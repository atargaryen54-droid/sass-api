name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_TAG: ${{ github.sha }}

      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}

      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      ALGORITHM: ${{ vars.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS }}

      REDIS_URL: ${{ vars.REDIS_URL }}

      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Verify production configuration
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            config


      - name: Pull application image
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            pull


      - name: Start infrastructure
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            up -d --wait db cache


      - name: Run database migrations
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            run --rm api \
            alembic upgrade head


      - name: Start application services
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            up -d api worker beat


      - name: Verify API health
        run: |
          echo "Waiting for API..."

          for i in {1..20}; do

            if curl --fail http://localhost:8000/health; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Attempt $i failed. Retrying..."
            sleep 3

          done

          echo "Health check failed."
          exit 1


      - name: Show container status
        if: always()
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            ps


      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            logs


      - name: Clean up
        if: always()
        run: |
          docker compose \
            -p saas-cd \
            -f docker-compose.prod.yml \
            down -v 